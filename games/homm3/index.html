<div id="app">
  <div id="screen">
    <!-- главное меню -->
    <div id="menu" class="screen"></div>
    <!-- карта приключений -->
    <div id="adv" class="screen hidden">
      <div id="advMain">
        <canvas id="mapCanvas"></canvas>
        <div id="advOverlay" class="hidden"></div>
        <div id="hudTop"><div id="resbar"></div><div id="datebar"></div></div>
        <div id="miniWrap" class="hidden"><canvas id="minimap" width="220" height="220"></canvas><div id="log"></div></div>
        <div id="hudBottom">
          <div id="heroStrip"><div id="objList"></div><div id="heroPanel"></div></div>
          <div id="advButtons"></div>
        </div>
      </div>
    </div>
    <!-- редактор карт -->
    <div id="editor" class="screen hidden">
      <div id="edTop"></div>
      <div id="edMain">
        <div id="edPalette"></div>
        <div id="edCanvasWrap"><canvas id="edCanvas"></canvas></div>
      </div>
    </div>
    <!-- бой -->
    <div id="battle" class="screen hidden">
      <div id="battleMain"><canvas id="battleCanvas"></canvas></div>
      <div id="battleBar"></div>
    </div>
  </div>
  <div id="modals"></div>
  <div id="toasts"></div>
  <div id="tip" class="hidden"></div>
</div>
