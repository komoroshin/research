<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Sprite sheet</title>
<style>body{background:#2a2f3a;color:#ddd;font:12px monospace;margin:0;padding:8px}#c{image-rendering:pixelated;background:#3c4452}</style>
</head><body>
<canvas id="c"></canvas>
<script src="../js/sprites.js"></script>
<script>
// ?files=a.js,b.js&scale=3&filter=prefix
const q = new URLSearchParams(location.search);
const files = (q.get('files') || '').split(',').filter(Boolean);
const scale = +(q.get('scale') || 3);
const filter = q.get('filter') || '';
const cols = +(q.get('cols') || 10);
let loaded = 0;
function go() {
  const names = Sprites.names().filter(n => !filter || n.startsWith(filter));
  const cell = 34 * scale + 8, cellH = 34 * scale + 22;
  const cv = document.getElementById('c');
  cv.width = cols * cell; cv.height = Math.ceil(names.length / cols) * cellH + 4;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  names.forEach((n, i) => {
    const x = (i % cols) * cell + 4, y = Math.floor(i / cols) * cellH + 4;
    ctx.fillStyle = '#4a5468'; ctx.fillRect(x, y, cell - 8, cellH - 8);
    ctx.fillStyle = '#5a6a5a'; ctx.fillRect(x, y + 32 * scale, cell - 8, 2 * scale);
    Sprites.draw(ctx, n, x + (cell - 8) / 2, y + 32 * scale, scale, false);
    ctx.fillStyle = '#fff'; ctx.font = (10 + scale) + 'px monospace';
    ctx.fillText(n, x + 2, y + cellH - 12);
  });
  window.__sheetDone = names.length;
}
if (!files.length) go();
files.forEach(f => { const s = document.createElement('script'); s.src = '../js/' + f; s.onload = () => { if (++loaded === files.length) go(); }; s.onerror = () => { console.error('fail ' + f); if (++loaded === files.length) go(); }; document.body.appendChild(s); });
</script>
</body></html>
