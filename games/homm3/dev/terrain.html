<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#222}canvas{image-rendering:pixelated}</style></head><body>
<canvas id="c"></canvas>
<script src="../js/util.js"></script><script src="../js/view/terrain.js"></script>
<script>
const types=['grass','dirt','sand','snow','swamp','rough','lava','water','rock','subter'];
const w=20,h=10, terrain=[], roads=[];
const rng=new U.RNG(7);
for(let y=0;y<h;y++){terrain.push([]);roads.push([]);for(let x=0;x<w;x++){terrain[y].push(types[Math.floor(x/2)]); roads[y].push(y===5&&x>1&&x<18 ? 1:0);}}
terrain[2][3]='water';terrain[3][3]='water';terrain[3][4]='water';
const cv=Terrain.renderMap({w,h,terrain,roads,seed:7});
const c=document.getElementById('c');c.width=cv.width;c.height=cv.height;c.getContext('2d').drawImage(cv,0,0);
</script></body></html>
