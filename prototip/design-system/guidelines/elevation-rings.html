<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:56px;border-radius:var(--radius-card);background:transparent;box-shadow:inset 0 0 0 2px var(--border-hairline)"></div><div class="lbl">hairline</div><div class="mono">sage-300 · line cards, scale cells</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:56px;border-radius:var(--radius-card);background:transparent;box-shadow:inset 0 0 0 2px var(--border-strong)"></div><div class="lbl">strong</div><div class="mono">sage-500 · ghost button, ahead dots</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:56px;border-radius:var(--radius-card);background:transparent;box-shadow:0 0 0 3px var(--focus-ring)"></div><div class="lbl">focus</div><div class="mono">3px sage-500, 2px offset</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:56px;border-radius:var(--radius-card);background:var(--forest);box-shadow:0 0 0 4px var(--sage-100)"></div><div class="lbl">current pin</div><div class="mono">halo on the active path node</div></div>
</div></div></body></html>
