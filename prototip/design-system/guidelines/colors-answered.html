<!-- @dsCard group="Colors" viewport="700x200" name="Second hue — answered" subtitle="Dusty blue has one job: this has an answer. Observation stays green" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div style="display:flex;gap:10px;align-items:flex-end">
<div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:52px;border-radius:12px;background:var(--slate-100);box-shadow:var(--ring-hairline)"></div><div class="lbl">slate-100</div><div class="mono">answered group row</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:52px;border-radius:12px;background:var(--slate-300);box-shadow:var(--ring-hairline)"></div><div class="lbl">slate-300</div><div class="mono">threshold card, notices</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:52px;border-radius:12px;background:var(--slate-500);box-shadow:var(--ring-hairline)"></div><div class="lbl">slate-500</div><div class="mono">completed days, path pins</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:52px;border-radius:12px;background:var(--slate-700);box-shadow:var(--ring-hairline)"></div><div class="lbl">slate-700</div><div class="mono">text on light</div></div>
</div>
<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px"><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-done)"></div><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-done)"></div><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-done)"></div><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-skipped);box-shadow:var(--ring-strong)"></div><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-today)"></div><div style="height:10px;border-radius:var(--radius-dot);box-shadow:var(--ring-strong)"></div><div style="height:10px;border-radius:var(--radius-dot);box-shadow:var(--ring-strong)"></div><div style="height:10px;border-radius:var(--radius-dot);box-shadow:var(--ring-strong)"></div></div>
<div class="mono">Done days are blue, today is still forest, ahead is an empty ring. Accent buttons stay green — the three suspicion buttons are choices, not answers.</div>
</div></body></html>
