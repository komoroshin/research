<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="display:flex;flex-direction:column;gap:6px"><div style="border-radius:var(--radius-button);min-height:52px;display:flex;align-items:center;justify-content:center;background:var(--forest);color:var(--cream-50);font-weight:700;font-size:15px;letter-spacing:.06em;">primary</div><div class="mono">forest → forest-800</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="border-radius:var(--radius-button);min-height:52px;display:flex;align-items:center;justify-content:center;background:var(--sage-300);color:var(--forest);font-weight:700;font-size:15px;letter-spacing:.06em;">accent</div><div class="mono">sage-300 → sage-100</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="border-radius:var(--radius-button);min-height:52px;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--forest);font-weight:700;font-size:15px;letter-spacing:.06em;box-shadow:var(--ring-strong);">ghost</div><div class="mono">2px sage-500 ring</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="border-radius:var(--radius-button);min-height:52px;display:flex;align-items:center;justify-content:center;background:var(--cream-50);color:var(--forest);font-weight:700;font-size:15px;letter-spacing:.06em;">cream</div><div class="mono">on forest surfaces</div></div>
</div></div></body></html>
