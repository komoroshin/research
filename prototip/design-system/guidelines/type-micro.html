<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<span style="font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-action);background:var(--surface-card);border-radius:var(--radius-chip);padding:6px 10px">lactose</span>
<span style="font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-action);background:var(--surface-screen);border-radius:var(--radius-chip);padding:6px 10px">fructans</span>
<span style="font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-action)">All tips <span style="font-size:18px">›</span></span>
<div style="display:flex;gap:6px;border-top:2px solid var(--border-strong);padding-top:10px;margin-left:auto;width:280px">
<div style="flex:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:10px 0;border-radius:var(--radius-chip);background:var(--surface-card);color:var(--text-action)">Today</div><div style="flex:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:10px 0;border-radius:var(--radius-chip);color:var(--text-eyebrow)">Path</div><div style="flex:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:10px 0;border-radius:var(--radius-chip);color:var(--text-eyebrow)">Tips</div>
</div></div>
<div class="mono">Chip 0.14em · ActionLink 0.12em + › · TabBar 11px/0.1em</div></div></body></html>
