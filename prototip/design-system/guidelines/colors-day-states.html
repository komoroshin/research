<!-- @dsCard group="Colors" viewport="700x160" name="Day & test states" subtitle="A skipped day differs by fill, never by an error colour — nothing red for symptoms" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-done)"></div><div class="lbl">done</div><div class="mono">sage-500</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-today)"></div><div class="lbl">today</div><div class="mono">forest</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:10px;border-radius:var(--radius-dot);box-shadow:var(--ring-strong)"></div><div class="lbl">ahead</div><div class="mono">2px ring</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-skipped);box-shadow:var(--ring-strong)"></div><div class="lbl">skipped</div><div class="mono">cream-100 + ring</div></div>
</div>
<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:2px"><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-done)"></div><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-done)"></div><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-done)"></div><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-skipped);box-shadow:var(--ring-strong)"></div><div style="height:10px;border-radius:var(--radius-dot);background:var(--day-today)"></div><div style="height:10px;border-radius:var(--radius-dot);box-shadow:var(--ring-strong)"></div><div style="height:10px;border-radius:var(--radius-dot);box-shadow:var(--ring-strong)"></div><div style="height:10px;border-radius:var(--radius-dot);box-shadow:var(--ring-strong)"></div></div>
<div class="mono">day 5 of 8 · one day not counted</div></div></body></html>
