<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">

y:var(--font-display);font-weight:700;text-transform:uppercase;font-size:15px;letter-spacing:-.02em;color:var(--text-body-on-dark)">dark</div><div class="mono" style="color:var(--text-body-on-dark);opacity:.75">forest</div></div>
</div></div></body></html>
