<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div style="display:flex;gap:16px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="font-family:var(--font-numeral);font-weight:700;font-size:48px;line-height:.9;letter-spacing:-.03em;color:var(--text-display)">12<span style="font-size:.5em;color:var(--text-muted)"> / 15</span></div><div class="lbl">48px</div></div><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="font-family:var(--font-numeral);font-weight:700;font-size:40px;line-height:.9;letter-spacing:-.03em;color:var(--text-display)">7<span style="font-size:.5em;color:var(--text-muted)"> none</span></div><div class="lbl">40px</div></div><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="font-family:var(--font-numeral);font-weight:700;font-size:30px;line-height:.9;letter-spacing:-.03em;color:var(--text-display)">6:00<span style="font-size:.5em;color:var(--text-muted)"> rule</span></div><div class="lbl">30px</div></div><div style="display:flex;flex-direction:column;gap:8px;flex:1"><div style="font-family:var(--font-numeral);font-weight:700;font-size:22px;line-height:.9;letter-spacing:-.03em;color:var(--text-display)">61<span style="font-size:.5em;color:var(--text-muted)"> resting hr</span></div><div class="lbl">22px</div></div></div>
<div class="mono">Rule of the brand: numbers large, explanations small. Captions use Eyebrow at 0.12em tracking.</div></div></body></html>
