<!-- @dsCard group="Colors" viewport="700x200" name="Dark theme scope" subtitle="[data-theme=dark] re-points the same tokens — no second palette" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div data-theme="dark" style="border-radius:var(--radius-card);padding:14px;background:var(--surface-screen);display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:8px">
<div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:40px;border-radius:10px;background:var(--surface-screen)"></div><div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow)">ink-dark-900</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-body-soft)">screen</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:40px;border-radius:10px;background:var(--surface-card-quiet)"></div><div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow)">ink-dark-800</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-body-soft)">quiet card</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:40px;border-radius:10px;background:var(--surface-card)"></div><div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow)">ink-dark-700</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-body-soft)">card</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:40px;border-radius:10px;background:var(--surface-card-accent)"></div><div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow)">ink-dark-600</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-body-soft)">accent</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:40px;border-radius:10px;background:var(--surface-card-dark)"></div><div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow)">moss-300</div><div style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--text-body-soft)">hero + action</div></div>
</div>
<div style="display:flex;gap:10px;align-items:center">
<div style="border-radius:var(--radius-button);min-height:44px;padding:0 18px;display:flex;align-items:center;background:var(--btn-primary-bg);color:var(--btn-primary-fg);font-weight:700;font-size:14px;letter-spacing:.06em">Close the day</div>
<div style="font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:20px;letter-spacing:-.02em;color:var(--text-display)">Eat as usual</div>
<div style="font-size:13px;color:var(--text-body-soft);margin-left:auto">body soft</div>
</div>
</div>
<div class="mono">The hero card inverts: darkest element on light, lightest on dark. Shadows drop to neutral black, grain to 4%.</div>
</div></body></html>
