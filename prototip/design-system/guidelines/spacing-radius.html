<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div style="display:flex;gap:12px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:6px;flex:1;align-items:center"><div style="width:100%;height:64px;border-radius:24px;background:var(--surface-card);box-shadow:var(--ring-hairline)"></div><div class="mono">24px card</div></div><div style="display:flex;flex-direction:column;gap:6px;flex:1;align-items:center"><div style="width:100%;height:64px;border-radius:20px;background:var(--surface-card);box-shadow:var(--ring-hairline)"></div><div class="mono">20px button</div></div><div style="display:flex;flex-direction:column;gap:6px;flex:1;align-items:center"><div style="width:100%;height:64px;border-radius:18px;background:var(--surface-card);box-shadow:var(--ring-hairline)"></div><div class="mono">18px stool tile</div></div><div style="display:flex;flex-direction:column;gap:6px;flex:1;align-items:center"><div style="width:100%;height:64px;border-radius:16px;background:var(--surface-card);box-shadow:var(--ring-hairline)"></div><div class="mono">16px segment</div></div><div style="display:flex;flex-direction:column;gap:6px;flex:1;align-items:center"><div style="width:100%;height:64px;border-radius:14px;background:var(--surface-card);box-shadow:var(--ring-hairline)"></div><div class="mono">14px scale cell</div></div><div style="display:flex;flex-direction:column;gap:6px;flex:1;align-items:center"><div style="width:100%;height:64px;border-radius:12px;background:var(--surface-card);box-shadow:var(--ring-hairline)"></div><div class="mono">12px chip / nav</div></div><div style="display:flex;flex-direction:column;gap:6px;flex:1;align-items:center"><div style="width:100%;height:64px;border-radius:6px;background:var(--surface-card);box-shadow:var(--ring-hairline)"></div><div class="mono">6px bar</div></div></div>
<div class="mono">Every inset border in the system is exactly 2px. The web device frame uses 44px.</div></div></body></html>
