<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div style="display:flex;align-items:center;gap:14px;"><div class="mono" style="width:74px;flex:none;">default</div><div style="font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-eyebrow)">Background for the day</div><div class="mono" style="margin-left:auto;">0.18em</div></div><div style="display:flex;align-items:center;gap:14px;"><div class="mono" style="width:74px;flex:none;">soft</div><div style="font-size:12px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-eyebrow-soft)">0 · none</div><div class="mono" style="margin-left:auto;">0.12em</div></div><div style="display:flex;align-items:center;gap:14px;background:var(--forest);border-radius:12px;padding:6px 10px;margin:0 -10px"><div class="mono" style="width:74px;flex:none;color:var(--sage-500)">on dark</div><div style="font-size:12px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-eyebrow-on-dark)">Observing</div><div class="mono" style="margin-left:auto;color:var(--sage-500)">0.18em</div></div><div style="display:flex;align-items:center;gap:14px;"><div class="mono" style="width:74px;flex:none;">forest</div><div style="font-size:12px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-action)">rough days with dairy</div><div class="mono" style="margin-left:auto;">0.12em</div></div></div></body></html>
