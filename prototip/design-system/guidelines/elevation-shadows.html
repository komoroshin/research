<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
<div style="display:flex;flex-direction:column;gap:8px"><div style="height:60px;border-radius:var(--radius-card);background:var(--surface-card-accent);box-shadow:0 18px 40px rgba(1,71,46,.2)"></div><div class="lbl">card</div><div class="mono">0 18px 40px rgba(1,71,46,.2)<br>dark &amp; accent cards, toast, photo tile</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:60px;border-radius:var(--radius-card);background:var(--surface-card-accent);box-shadow:0 8px 20px rgba(1,71,46,.25)"></div><div class="lbl">knob</div><div class="mono">0 8px 20px rgba(1,71,46,.25)<br>slider thumb</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:60px;border-radius:var(--radius-card);background:var(--surface-card-accent);box-shadow:0 30px 60px rgba(1,71,46,.2)"></div><div class="lbl">device</div><div class="mono">0 30px 60px rgba(1,71,46,.2)<br>phone frame on the web stage</div></div>
</div></div></body></html>
