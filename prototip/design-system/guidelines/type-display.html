<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div style="display:flex;align-items:baseline;gap:14px"><div class="mono" style="width:74px;flex:none">34px answer</div><div style="font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:34px;line-height:1.04;letter-spacing:-.02em;color:var(--text-display)">Milk: up to 125 ml is fine</div></div><div style="display:flex;align-items:baseline;gap:14px"><div class="mono" style="width:74px;flex:none">26px screen</div><div style="font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:26px;line-height:1.04;letter-spacing:-.02em;color:var(--text-display)">Your path</div></div><div style="display:flex;align-items:baseline;gap:14px"><div class="mono" style="width:74px;flex:none">24px hero</div><div style="font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:24px;line-height:1.04;letter-spacing:-.02em;color:var(--text-display)">Eat as usual</div></div><div style="display:flex;align-items:baseline;gap:14px"><div class="mono" style="width:74px;flex:none">22px card</div><div style="font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:22px;line-height:1.04;letter-spacing:-.02em;color:var(--text-display)">Today without dairy</div></div><div style="display:flex;align-items:baseline;gap:14px"><div class="mono" style="width:74px;flex:none">20
