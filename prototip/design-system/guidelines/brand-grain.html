<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}.w{padding:18px 20px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;color:var(--text-body-soft)}</style></head><body><div class="w"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
<div style="height:86px;border-radius:var(--radius-card);background:var(--cream-50);background-image:var(--grain);box-shadow:var(--ring-hairline)"></div>
<div style="height:86px;border-radius:var(--radius-card);background:var(--forest);background-image:var(--grain)"></div>
<div style="height:86px;border-radius:var(--radius-card);background:var(--paper);box-shadow:var(--ring-hairline)"></div>
</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px"><div class="mono">cream + grain · app default</div><div class="mono">forest + grain · hero &amp; modals</div><div class="mono">paper, no grain · doctor page, print</div></div></div></body></html>
