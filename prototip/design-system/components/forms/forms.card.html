<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-text);background:var(--surface-screen);background-image:var(--grain);color:var(--text-body)}#root{padding:18px 20px}a{color:var(--text-action)}a:hover{color:var(--forest-800)}.g{display:grid;gap:12px}.lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--text-eyebrow-soft);margin-bottom:6px}</style></head><body><div id="root"></div><script type="text/babel">
const { SegmentedControl, ScaleStepper, ScaleSlider, StoolPicker, Switch, Card, BodyText, Eyebrow, ActionLink } = window.ThresholdDesignSystem_2ce5e4;
const LVL=['none','mild','mild','mild','got in the way','got in the way','got in the way','strong','strong','strong','worst ever'];
const TYPES=['none','hard lumps','lumpy sausage','cracked surface','smooth, soft','soft pieces','mushy','liquid'];
function Demo(){
  const [q,setQ]=React.useState(0),[belly,setBelly]=React.useState(4),[stool,setStool]=React.useState(4),[a,setA]=React.useState(true),[b,setB]=React.useState(false);
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,alignItems:'start'}}>
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div><div className="lbl">SegmentedControl</div><Eyebrow>What bothers you</Eyebrow>
        <SegmentedControl style={{marginTop:6}} options={['bloating','pain','bowel habits']} value={q} onChange={setQ}/></div>
      <div><div className="lbl">ScaleStepper · 0–10, exact</div><ScaleStepper label="Belly" sub="pain or discomfort" value={belly} labels={LVL} onChange={setBelly}/></div>
      <div><div className="lbl">ScaleSlider · 0–10, compact</div><ScaleSlider label="Bloating" sub="fullness, tight belly" value={belly} labels={LVL} onChange={setBelly}/></div>
      <div><div className="lbl">Switch · day flags</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <Card variant="quiet" tight style={{display:'flex',justifyContent:'space-between',alignItems:'center',minHeight:52}}><BodyText size="sm">Alcohol</BodyText><Switch checked={a} onChange={setA}/></Card>
          <Card variant="quiet" tight style={{display:'flex',justifyContent:'space-between',alignItems:'center',minHeight:52}}><BodyText size="sm">Unwell</BodyText><Switch checked={b} onChange={setB}/></Card>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',borderRadius:'var(--radius-card)',padding:'4px 16px',minHeight:52,boxShadow:'var(--ring-strong)',marginTop:8}}><BodyText tone="soft" size="sm">Blood in stool</BodyText><ActionLink>Report</ActionLink></div>
      </div>
    </div>
    <div><div className="lbl">StoolPicker · Bristol, CSS-drawn shapes</div>
      <StoolPicker value={stool} onChange={setStool} sub="pick the closest" keyline="1–2 constipation · 3–5 normal · 6–7 loose" types={TYPES}/></div>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
