<!-- @dsCard group="App" viewport="1700x1000" name="Palette weight — B and three steps" subtitle="Softer green fills as the base, then draining green out of the light half" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Threshold — palette weight, B</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;background:var(--surface-stage);font-family:var(--font-text);color:var(--text-body)}a{color:var(--text-action)}a:hover{color:var(--forest-800)}
#root{padding:28px 32px 48px}
.head{margin-bottom:24px;max-width:920px}
.h1{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:26px;letter-spacing:-.02em;color:var(--forest)}
.sub{font-size:14px;line-height:1.45;color:var(--ink-600);margin-top:8px}
.cols{display:flex;gap:26px;align-items:flex-start}
.col{width:390px;display:flex;flex-direction:column;gap:12px}
.key{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--forest)}
.desc{font-size:12px;line-height:1.45;color:var(--ink-600);min-height:104px}
.swatches{display:flex;gap:6px}
.swatches div{flex:1;height:20px;border-radius:6px;box-shadow:var(--ring-hairline)}
.phone{position:relative;width:390px;height:844px;border-radius:var(--radius-phone);overflow:hidden;background:var(--surface-screen);background-image:var(--grain);box-shadow:var(--shadow-card-sm)}
.pair{font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-600);margin:6px 0 -4px}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="TodayScreen.jsx"></script>
<script type="text/babel" src="DecisionScreens.jsx"></script>
<script type="text/babel">
const noop = () => {};
const MEALS = [{ time:'08:30', name:'Oatmeal with milk', groups:['lactose'] }, { time:'13:10', name:'Garlic pasta', groups:['fructans'] }];

/* B softens the dark fills. B1–B3 then drain green out of the light half, one layer at a time. */
const B = {
  '--surface-card-dark': 'oklch(0.36 0.045 156)',
  '--surface-card-lift': 'oklch(0.42 0.045 156)',
  '--surface-screen-dark': 'oklch(0.34 0.042 156)',
  '--text-body-on-dark': 'oklch(0.90 0.045 120)',
};

const OPTIONS = [
  {
    id: 'B',
    name: 'Softer fills only',
    desc: 'Where we left off: large forest surfaces lose chroma, everything light stays as shipped — cream-50 screen, sage-100 cards, sage-300 accents. The green that remains is mostly in the light half now.',
    vars: { ...B },
    swatches: ['oklch(0.36 0.045 156)', 'var(--sage-300)', 'var(--sage-100)', 'var(--cream-100)', 'var(--cream-50)'],
  },
  {
    id: 'B1',
    name: '+ neutral cards',
    desc: 'Cards stop being green: sage-100 → cream-100, and the quiet card goes a shade lighter. Sage survives only where it carries meaning — the accent card, the rules, the rings, the completed day dots. The screen colour is untouched.',
    vars: {
      ...B,
      '--surface-card': 'var(--cream-100)',
      '--surface-card-quiet': 'oklch(0.975 0.017 95)',
      '--track-empty': 'oklch(0.955 0.02 95)',
    },
    swatches: ['oklch(0.36 0.045 156)', 'var(--sage-300)', 'var(--cream-100)', 'oklch(0.975 0.017 95)', 'var(--cream-50)'],
  },
  {
    id: 'B2',
    name: '+ warmer, less yellow screen',
    desc: 'B1 plus a calmer paper: cream-50 (#FEFAE0 — quite a yellow-green) moves to a warm off-white at the same lightness but a third of the chroma. Reads as paper rather than as a tinted surface, and the grain does more of the work.',
    vars: {
      ...B,
      '--surface-card': 'var(--cream-100)',
      '--surface-card-quiet': 'oklch(0.975 0.014 85)',
      '--track-empty': 'oklch(0.955 0.016 85)',
      '--surface-screen': 'oklch(0.982 0.012 85)',
      '--surface-card-accent': 'oklch(0.90 0.035 130)',
    },
    swatches: ['oklch(0.36 0.045 156)', 'oklch(0.90 0.035 130)', 'var(--cream-100)', 'oklch(0.975 0.014 85)', 'oklch(0.982 0.012 85)'],
  },
  {
    id: 'B3',
    name: '+ ink headlines',
    desc: 'B2 plus lever C: Display and Numeral go ink-700, so the softened green appears only on things you can act on — buttons, selected cells, the day-in-progress dot. This is the quietest the system gets without changing a single layout.',
    vars: {
      ...B,
      '--surface-card': 'var(--cream-100)',
      '--surface-card-quiet': 'oklch(0.975 0.014 85)',
      '--track-empty': 'oklch(0.955 0.016 85)',
      '--surface-screen': 'oklch(0.982 0.012 85)',
      '--surface-card-accent': 'oklch(0.90 0.035 130)',
      '--text-display': 'var(--ink-700)',
    },
    swatches: ['var(--ink-700)', 'oklch(0.36 0.045 156)', 'oklch(0.90 0.035 130)', 'var(--cream-100)', 'oklch(0.982 0.012 85)'],
  },
];

function Col({ opt }) {
  return (
    <div className="col" style={opt.vars}>
      <div className="key">{opt.id} · {opt.name}</div>
      <div className="swatches">{opt.swatches.map((c, i) => <div key={i} style={{ background: c }} />)}</div>
      <div className="desc">{opt.desc}</div>
      <div className="pair">Today · observing</div>
      <div className="phone">
        <TodayScreen day={14} check={null} insight={false} meals={MEALS} tab="today" onTab={noop} onInsightOk={noop} onOpenDay={noop} onAddMeal={noop} onOpenPlan={noop} />
      </div>
      <div className="pair">The suspect</div>
      <div className="phone">
        <SuspicionScreen onTest={noop} onNotNow={noop} onOther={noop} />
      </div>
    </div>
  );
}

function Study() {
  return (
    <div>
      <div className="head">
        <div className="h1">From B: draining green out of the light half</div>
        <div className="sub">
          B softened the dark fills, which moved the problem rather than solving it — with the hero card calmer, the sage cards and the yellow-green paper are now the loudest green on screen.
          Each column adds one layer to the previous, so you can stop wherever it feels right. Nothing here touches layout, type or spacing, and sage is never removed from the places where it means something.
        </div>
      </div>
      <div className="cols">{OPTIONS.map((o) => <Col key={o.id} opt={o} />)}</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Study />);
</script></body></html>
